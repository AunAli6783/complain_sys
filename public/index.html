
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 30px; }
        .form-container { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .complaints-list { background: white; padding: 20px; border-radius: 8px; }
        .complaint-item { border-bottom: 1px solid #eee; padding: 15px 0; }
        .complaint-item:last-child { border-bottom: none; }
        .status { padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        .status.pending { background: #ffc107; }
        .status.in_progress { background: #17a2b8; color: white; }
        .status.resolved { background: #28a745; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Complaint Management System</h1>
        
        <div class="form-container">
            <h2>Submit a Complaint</h2>
            <form id="complaintForm">
                <div class="form-group
